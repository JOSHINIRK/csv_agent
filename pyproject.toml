[project]
name = "csv-data-explorer"
version = "1.0.0"
description = "Pydantic AI agent that ingests CSV files, detects their schema and answers questions with charts and summaries"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
